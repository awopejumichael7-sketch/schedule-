name: SSAS Accountability Engine

# Separate workflow from the reminder engine so a slowdown/failure in one
# never blocks the other. Runs every 5 minutes; each user's actual
# check-in only fires once their own local clock enters their configured
# window (see server-accountability-engine.js) — most runs are cheap
# no-ops for most users.
#
# NOTE ON FOLDER LAYOUT: see the same note in reminder-scheduler.yml —
# this path is a GitHub Actions platform requirement, the one exception
# to SSAS's otherwise single-folder layout.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-accountability-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run accountability engine
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node server-accountability-engine.js
